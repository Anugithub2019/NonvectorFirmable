# Firmable market graph — machine-readable schema (LinkML-style YAML).
#
# Two layers, one file:
#   1. OBSERVATION layer: what a source row may claim. Lives in firmable_ontology.yaml (v0.2).
#      Mapping configs generated by the onboarding agent target those fields.
#   2. GRAPH layer (this file): what the resolved graph stores. Each observation section maps
#      to exactly one node or edge type below (see `loader_rules`).
#
# Design principle: derived from the five questions in `questions`, not from the sources.
# Every decision that a question forced is marked `because:`.

id: https://firmable.example/market-graph
name: firmable_market_graph
version: 0.1.0
default_range: string

# ---------------------------------------------------------------------------------------------
questions:                     # the graph must answer these; each shaped a decision below
  Q1: "Who is this? A messy reference (name, ABN, LEI, typo) -> ranked candidates with evidence."
  Q2: "Who ultimately owns company X? Follow the chain, terminate safely when it cycles."
  Q3: "Which organisations are within two hops of a banned or disqualified party?"
  Q4: "Which financial-services licensees had a licence cancelled in the last N months, and
       what else is on record about them?"
  Q5: "Give me a stable, flat table of <subset> with <columns> that I can take away and re-run."

# ---------------------------------------------------------------------------------------------
classes:

  Party:
    abstract: true
    description: >
      Anything that can hold a licence, be banned, own or be owned. Two concrete subtypes.
      because: Q3 — a disqualification attaches to a person OR an organisation, and traversals
      must cross both without a type check; Q1 — person names need a stricter resolution
      policy than organisation names, so the subtype must be known at resolution time.
    attributes:
      key:            {identifier: true, description: "Canonical key. abn:<11> | acn:<9> | lei:<20> | src:<source>:<record_id> for unresolved singletons. Never reused."}
      display_name:   {description: "Current preferred name (precedence ASIC > ABR > GLEIF > others)."}
      name_conflict:  {range: boolean, description: "True when two sources disagree on the current legal name; losing values kept as Name nodes and in DuckDB."}
      resolved_at:    {range: datetime}
      matcher_version: {description: "Version of the resolution run that formed this node."}

  Organisation:
    is_a: Party
    attributes:
      abn:            {pattern: '^\d{11}$', description: "Checksum-validated. Unique where present."}
      acn:            {pattern: '^\d{9}$',  description: "Checksum-validated. Unique where present."}
      lei:            {pattern: '^[A-Z0-9]{20}$'}
      entity_type:    {range: EntityType}
      status:         {range: Status}
      state:          {range: State, description: "PROPERTY, not a node: a State node would have ~500k edges at slice scale, millions at 15M."}
      postcode:       {description: "Property for the same reason as state."}
      locality:       {}
      industry_code:  {description: "ANZSIC where a source gives it. Property, not node (same degree argument)."}
      date_registered: {range: date}
      website:        {}

  Person:
    is_a: Party
    attributes:
      role:           {description: "liquidator | director | banned_person | sole_trader | other"}
      registration_number: {}
      abn:            {pattern: '^\d{11}$', description: "Sole traders carry an ABN."}

  Name:
    description: >
      One distinct normalised name string. Reified (a node, not a property) because a name
      carries validity time and provenance of its own: a former name is true for a period,
      a trading name is asserted by a specific source.
      because: Q1 (resolve over every name variant, with the source that asserted it) and
      the time question (what was it called on date D).
      Degree note: keyed on exact normalised text, so degree = number of parties sharing the
      exact string. Checked at load: any Name with degree > 50 is logged in load_report.
    attributes:
      normalised:     {identifier: true, description: "Upper-cased, punctuation-stripped, legal-form words removed."}
      text:           {description: "A representative raw spelling."}

  Licence:
    description: >
      Reified: a licence has its own number, status, dates, authorisations and transfer history.
      because: Q4 — 'cancelled in the last N months' is a predicate on the licence, not on the holder.
    attributes:
      licence_id:     {identifier: true, description: "<licence_type>:<licence_number>"}
      licence_type:   {range: LicenceType}
      licence_number: {}
      status:         {range: LicenceStatus}
      start_date:     {range: date}
      end_date:       {range: date, description: "Null = current as far as the source knows."}
      authorisations: {multivalued: true}
      conditions:     {}
      source:         {}

  Ban:
    description: >
      Reified: a ban has a type and a duration, and one party can carry several.
      because: Q3 and the wrong-link cost — a Ban node keeps the accusation attached to its
      own source record, so an incorrect SUBJECT_OF edge can be cut without touching the party.
    attributes:
      ban_id:         {identifier: true, description: "<source>:<record_id>"}
      ban_type:       {}
      start_date:     {range: date}
      end_date:       {range: date, description: "Null = indefinite / still in force."}
      issuing_authority: {}
      reference:      {}

  SourceRecord:
    description: >
      One raw row of one source, as a lightweight node. The full raw payload lives in DuckDB
      (source_records table); the node carries only identity, hash and timestamps.
      Source records NEVER disappear after resolution: the RESOLVED_TO edge is the only thing
      a re-run changes, which is what makes a merge undoable.
    attributes:
      record_key:     {identifier: true, description: "<source_id>:<source_record_id>"}
      source_id:      {}
      source_record_id: {}
      content_hash:   {description: "sha1 of the raw row; a weekly re-load with the same hash is a no-op."}
      observed_at:    {range: datetime}
      ingested_at:    {range: datetime}
      licence:        {description: "Data licence of the source (from catalogue metadata)."}
      extractor_version: {}

# ---------------------------------------------------------------------------------------------
relationships:                 # edge types. All edges carry `provenance` slots (below).

  RESOLVED_TO:
    domain: SourceRecord
    range: Party
    description: "The resolution decision. One per source record (or none: abstained)."
    attributes:
      match_type:     {range: MatchType}
      confidence:     {range: float}
      matcher_version: {}
      threshold:      {range: float}
      evidence:       {description: "JSON string: the fields compared and their agreement."}

  KNOWN_AS:
    domain: Party
    range: Name
    attributes:
      kind:           {range: NameKind}
      valid_from:     {range: date}
      valid_to:       {range: date}
      source_id:      {}

  HOLDS:
    domain: Party
    range: Licence
    attributes: {source_id: {}, valid_from: {range: date}, valid_to: {range: date}}

  SUBJECT_OF:
    domain: Party
    range: Ban
    attributes: {source_id: {}, confidence: {range: float}, match_type: {range: MatchType}}

  OWNS:
    domain: Party
    range: Organisation
    description: >
      Ownership as an EDGE with properties, not a reified node: a single source (GLEIF) asserts
      it, so per-source provenance fits on the edge. Extension point: when a second source
      asserts ownership, promote to an `Ownership` node (see extension_points).
    attributes:
      kind:           {description: "direct | ultimate"}
      percent:        {range: float}
      valid_from:     {range: date}
      valid_to:       {range: date}
      source_id:      {}

  AFFILIATED_WITH:
    domain: Person
    range: Organisation
    description: "Person-to-organisation membership, e.g. a registered liquidator and their firm."
    attributes: {role: {}, valid_from: {range: date}, valid_to: {range: date}, source_id: {}}

  SUCCESSOR_OF:
    domain: Organisation
    range: Organisation
    attributes: {source_id: {}, valid_from: {range: date}}

# ---------------------------------------------------------------------------------------------
enums:
  EntityType:    {permissible_values: [company, sole_trader, partnership, trust, incorporated_association, government, other, unknown]}
  Status:        {permissible_values: [active, deregistered, in_liquidation, suspended, unknown]}
  State:         {permissible_values: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT, NZ, OTHER]}
  LicenceType:   {permissible_values: [afs, credit, building, liquor, environmental, other]}
  LicenceStatus: {permissible_values: [current, suspended, cancelled, ceased, unknown]}
  NameKind:      {permissible_values: [legal, trading, former, other]}
  MatchType:
    description: "Our own vocabulary. A deterministic identifier join and a fuzzy name match never share a label."
    permissible_values:
      exact_abn:        {description: "Same checksum-valid ABN."}
      exact_acn:        {description: "Same checksum-valid ACN."}
      exact_lei:        {description: "Same LEI."}
      exact_registered_as: {description: "GLEIF registeredAs equals an ABN/ACN."}
      bridge_abr_acn:   {description: "ABR row carries the ACN that an ASIC row carries (ABR is the bridge)."}
      name_exact_norm:  {description: "Identical normalised name AND same state/postcode, no identifier conflict."}
      name_semantic:    {description: "Semantic path: blocked candidates scored by string similarity, decided by the Jev decision model."}
      singleton:        {description: "No link: the record is its own entity (key src:...)."}

# ---------------------------------------------------------------------------------------------
constraints:                   # enforced in Neo4j (ontology/graph.cypher) and checked at load
  unique:
    - Party.key
    - Organisation.abn      # where present
    - Organisation.acn      # where present
    - Organisation.lei      # where present
    - Licence.licence_id
    - Ban.ban_id
    - Name.normalised
    - SourceRecord.record_key
  cardinality:
    - "SourceRecord -RESOLVED_TO-> Party: exactly 1. A record the resolver refused to link across
       sources still resolves to its own singleton party (key src:...), or to the party of an
       identical name within the same source; the refusal itself is the abstentions row."
  invariants:
    - "ABN and ACN pass their checksum or the record is rejected at ingest (records_rejected)."
    - "One Party has at most one ABN/ACN/LEI. Two valid, different ABNs on one ACN => the ACN is
       NOT merged; both parties exist and the ACN join abstains with reason identifier_conflict."
    - "One ACN under two legal names (ASIC former name vs ABR current) => both kept as Name nodes
       with validity; display_name by precedence; name_conflict=true if both claim to be current."
    - "An edge never outlives its source record: deleting a SourceRecord cascades its RESOLVED_TO
       and the HOLDS/SUBJECT_OF/OWNS edges it asserted (tracked by source_id on the edge)."

# ---------------------------------------------------------------------------------------------
loader_rules:                  # observation section -> graph element (one rule each)
  entity.*:         "Party node (Organisation unless entity_type in {sole_trader} and source says individual -> Person); key from identifiers"
  address.*:        "Properties on the Party (state, postcode, locality, full)"
  entity.trading_name / entity.legal_name: "Name node + KNOWN_AS {kind}"
  person.*:         "Properties on the Person"
  licence.*:        "Licence node + HOLDS from the row's Party"
  ban.*:            "Ban node + SUBJECT_OF from the row's Party"
  related_party.*:  "Second Party (resolved by the same rules) + edge by `relationship`: owned_by->OWNS(parent->child), member_of->AFFILIATED_WITH, successor_of->SUCCESSOR_OF, trading_as->KNOWN_AS"
  observation envelope: "SourceRecord node + RESOLVED_TO"

# ---------------------------------------------------------------------------------------------
extension_points:
  new_relationship_type: >
    Add a value to related_party.relationship in firmable_ontology.yaml and one line to
    loader_rules. Edges carry the standard provenance slots (source_id, valid_from, valid_to),
    so no existing node or edge changes. Reprocess: only the new source's observations.
  new_entity_type: >
    Add a section to firmable_ontology.yaml (as `licence` was added) and a class here with an
    identifier; add one loader rule. Existing data is untouched.
  ownership_from_a_second_source: >
    Promote OWNS to an Ownership node ({percent, valid_from, valid_to}) with ASSERTED_BY edges to
    SourceRecord nodes. Only ownership edges are reprocessed.
  people_at_scale: >
    130M people would make Person the largest label. Person nodes are only created from
    sources that identify a person by a register number or an ABN; name-only persons stay as
    SourceRecord singletons and are never merged by name.

degree_hotspots:
  avoided_by_design: "State, postcode, industry code, entity type, licence type, ban type are properties. As nodes each would be a hub with 10^5-10^7 edges."
  legitimate_hubs: "Large corporates (hundreds of licences / subsidiaries), prolific liquidators (hundreds of appointments). Handled by capped traversals (see retrieval.caps)."
  watched: "Name nodes: degree > 50 logged at load; generic names (e.g. 'THE TRUSTEE FOR THE FAMILY TRUST') are excluded from the semantic path's blocking keys."

retrieval:
  caps:
    neighbours_per_type: 25
    drop_rule: "most recent valid_from first; ties by source precedence; the count of dropped items is always returned"
    traversal_max_hops: 4
    ultimate_parent_max_depth: 12
    cycle_policy: "stop at first repeated key; return the cycle members and flag terminated_by=cycle"
